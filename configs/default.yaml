database_path: data/gitgoblin.db
artifact_dir: data/artifacts
user_agent: "GitGoblin/0.1 (frontier-intelligence; contact=operator)"
request_timeout_seconds: 20
max_retries: 3
github:
  token_env: GITHUB_TOKEN
  api_version: "2026-03-10"
  pages_per_seed: 2
  include_following: true
  include_starred: true
  include_events: true
  include_repositories: true
scoring:
  recency_half_life_days: 21
  young_repo_days: 180
  min_experts: 2
  min_signal_score: 0.42
  build_threshold: 0.72
  research_threshold: 0.55
  watch_threshold: 0.38
  action_weights:
    follow: 0.12
    star: 0.25
    watch: 0.22
    fork: 0.55
    issue: 0.45
    pull_request: 0.82
    push: 0.88
    create: 0.75
    dependency: 0.92
    authored: 0.95
    cited: 0.65
