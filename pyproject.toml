[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgoblin"
version = "0.1.0"
description = "Frontier technical-attention intelligence for detecting emerging primitives and product opportunities."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4.23"]

[project.scripts]
gitgoblin = "gitgoblin.cli:main"
gitgoblin-mcp = "gitgoblin.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["gitgoblin*"]

[tool.setuptools.package-data]
gitgoblin = ["static/*.html"]
